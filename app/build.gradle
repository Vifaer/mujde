plugins {
    id 'com.android.application'
}

def pinnedFridaVersion = (findProperty('FRIDA_VERSION') ?: '17.16.4').toString()

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.rel.mujde"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "1.1.3"

        buildConfigField "String", "FRIDA_VERSION", "\"${pinnedFridaVersion}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    namespace 'com.rel.mujde'

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        warningsAsErrors false
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // Frida injectors are vendored under src/main/jniLibs (pinned FRIDA_VERSION).
    // Re-download manually if bumping version:
    //   frida-inject-<ver>-android-{arm,arm64,x86,x86_64}.xz -> libfrida-inject.so
    task verifyFrida {
        doLast {
            def stamp = new File(projectDir, 'src/main/jniLibs/.frida-version')
            def archs = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
            archs.each { arch ->
                def f = new File(projectDir, "src/main/jniLibs/${arch}/libfrida-inject.so")
                if (!f.exists() || f.length() < 1000000) {
                    throw new GradleException("Missing Frida injector for ${arch}. Place libfrida-inject.so (version ${pinnedFridaVersion})")
                }
            }
            if (stamp.exists()) {
                println "Using vendored Frida ${stamp.text.trim()}"
            } else {
                println "Using vendored Frida (expected ${pinnedFridaVersion})"
            }
        }
    }
    preBuild.dependsOn verifyFrida
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'com.google.code.gson:gson:2.10.1'

    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib') {
            version { strictly '1.8.22' }
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7') {
            version { strictly '1.8.22' }
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8') {
            version { strictly '1.8.22' }
        }
    }

    compileOnly 'de.robv.android.xposed:api:82'
}
